name: ml
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - pillow
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch>=2.7.1
    - torchvision
    - transformers>=4.56
    - datasets
    - accelerate
    - evaluate
    - peft
    - timm
    - wandb
    - polars
    - duckdb
    - plotly
    - kaleido
    - optuna
    - kagglehub
    - pytest
    - albumentations
    - opencv-python-headless
