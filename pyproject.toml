[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nicme"
version = "0.1.0"
description = "NICME: Non-identical Cost Matrix Embeddings for cost-sensitive image classification"
requires-python = ">=3.12"

[project.scripts]
nicme-train = "nicme.cli:train"
nicme-train-reg = "nicme.cli:train_reg"
nicme-sweep = "nicme.cli:sweep"
nicme-hpo = "nicme.cli:hpo"
nicme-compare-sweeps = "nicme.cli:compare_sweeps"
nicme-prepare-data = "nicme.cli:prepare_data"
nicme-check-multiclass-readiness = "nicme.cli:check_multiclass_readiness"
nicme-check-dinov3-storage = "nicme.cli:check_dinov3_storage"
nicme-run-binary-experiments = "nicme.cli:run_binary_experiments"
nicme-run-multiclass-experiments = "nicme.cli:run_multiclass_experiments"
nicme-run-pmi10-no-cal-experiments = "nicme.cli:run_pmi10_no_cal_experiments"
nicme-experiment-stop = "nicme.cli:experiment_stop"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "examples/ImgDownloadToken.py",
    "examples/imageProcessorTest.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["nicme", "model", "utils", "scripts"]

[tool.setuptools.packages.find]
include = ["nicme*", "model*", "utils*", "scripts*"]
